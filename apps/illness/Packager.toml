# Windows installer configuration for Illness (cargo-packager 0.11.8).
#
# Build from this directory:
#   cargo packager --release
# or run apps/illness/build-installer.ps1 from anywhere.
#
# Keep `version` in sync with [workspace.package] in the root Cargo.toml.
# The app embeds its fonts and window icon, so the only packaged resources are
# the license and attribution files below; user settings live in %APPDATA%\illness.

name = "illness"
product-name = "Illness"
version = "0.1.0"
identifier = "dev.simulp.illness"
publisher = "Simulp"
description = "A Windows-first terminal emulator built on Alacritty's VT core and egui."
copyright = "Copyright (c) 2026 Simulp"
license-file = "installer-license.txt"
formats = ["nsis"]

# License and attribution files installed next to the executable. Apache-2.0,
# MIT, MPL-2.0 and BSL-1.0 all require the text to travel with the binary.
resources = [
  { src = "../../LICENSE-APACHE", target = "LICENSE-APACHE" },
  { src = "../../LICENSE-MIT", target = "LICENSE-MIT" },
  { src = "../../NOTICE", target = "NOTICE" },
  { src = "../../THIRD-PARTY-LICENSES.md", target = "THIRD-PARTY-LICENSES.md" },
]

# cargo builds into the workspace target directory; installers go to dist/.
out-dir = "../../dist"
binaries-dir = "../../target/release"
binaries = [{ path = "illness", main = true }]
icons = ["../../assets/illness.ico"]

before-packaging-command = "cargo build --release -p illness"

[nsis]
# Machine-wide install: UAC prompt, $PROGRAMFILES64\Illness, All Users Start
# Menu shortcut, and an uninstall entry in Programs and Features for all users.
# Do not change this to "currentUser" or "both".
# Note: cargo-packager 0.11.8 does not accept `install-mode`; the canonical
# config key is `installMode` (alias: `installer-mode`).
installMode = "perMachine"
# Project copy of cargo-packager's NSIS template. A perMachine install registers
# the Explorer verbs under HKLM\Software\Classes and removes them plus legacy
# HKCU/loaded-HKEY_USERS copies at install/uninstall; a portable/current-user
# copy falls back to HKCU. Keep it in sync with the cargo-packager version
# pinned by build-installer.ps1.
template = "installer.nsi"
installer-icon = "../../assets/illness.ico"
compression = "lzma"
languages = ["English"]
# Uninstaller can optionally remove the per-user config; it is kept by default.
appdata-paths = ['$APPDATA\illness']
