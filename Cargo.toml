[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
illness-core = { path = "crates/illness-core" }
illness-term = { path = "crates/illness-term" }
illness-ui = { path = "crates/illness-ui" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
directories = "6"
log = "0.4"
env_logger = "0.11"
crossbeam-channel = "0.5"
arboard = "3.7"
open = "5"
alacritty_terminal = "0.26.0"
egui = "0.37"
egui-wgpu = "0.37"
eframe = { version = "0.37", features = ["wgpu"] }
swash = "0.2.10"
fontdb = { version = "0.24", default-features = false, features = ["std", "fs"] }
window-vibrancy = "0.8.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry"] }
raw-window-handle = "0.6"
rfd = { version = "0.17", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "bmp"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1

